<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Jey Praveen Sivaraj</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/portfolio/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0A0B0D; --txt:#F3F5F8; --txt-3:#76808F; --line:#23262E; --accent:#5B8CFF; --on-accent:#07080A; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#F1F1EE; --txt:#0B0C0F; --txt-3:#6E7684; --line:#DBDBD3; --accent:#2A50D6; --on-accent:#fff; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: var(--bg);
    color: var(--txt);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    text-align: center;
  }
  h1 {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: clamp(4rem, 22vw, 11rem);
    line-height: .88;
    letter-spacing: -.06em;
  }
  p { margin-top: 1rem; color: var(--txt-3); font-size: .82rem; letter-spacing: .12em; text-transform: uppercase; }
  a {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    margin-top: 2.25rem;
    padding: .9rem 1.3rem;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
    font-size: .76rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    text-decoration: none;
    transition: transform .2s cubic-bezier(.22,1,.36,1);
  }
  a:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page does not exist.</p>
    <a href="/portfolio/">&larr; Back to the portfolio</a>
  </main>
</body>
</html>
